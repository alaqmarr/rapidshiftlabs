# ==============================================================================
# RapidShift Labs — Production Nginx Reverse Proxy Configuration
# ==============================================================================
# Upstream: Next.js 16 App Router on http://127.0.0.1:3000
# Features:
#   - HTTP to HTTPS redirection (Port 80 -> 443)
#   - Server-Sent Events (SSE) & streaming support (buffering disabled)
#   - WebSockets connection upgrading
#   - Hardened security headers (HSTS, nosniff, Referrer-Policy)
#   - Customized X-Frame-Options & CSP to permit /embed/* iframe embedding
#   - Static asset caching for /_next/static/ (1 year immutable)
#   - 25M request body limit for file uploads & PDF attachments
# ==============================================================================

# WebSocket and HTTP/1.1 Connection upgrade mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Dynamic X-Frame-Options:
# Allow external client web apps to iframe /embed/* widgets, while strictly
# enforcing SAMEORIGIN across all administrative and portal routes.
map $request_uri $x_frame_options {
    ~*^/embed(/.*)?$  "";
    default           "SAMEORIGIN";
}

# Dynamic Content-Security-Policy frame-ancestors:
# Permits external embedding for /embed/* while restricting portal/admin to self.
map $request_uri $frame_ancestors_policy {
    ~*^/embed(/.*)?$  "frame-ancestors *";
    default           "frame-ancestors 'self'";
}

# Upstream Next.js 16 Application
upstream rapidshift_portal {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ------------------------------------------------------------------------------
# HTTP Server Block: Let's Encrypt ACME Challenge & HTTPS Redirection
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    # Replace with your actual domain names (Admin, Client Portal, and API)
    server_name admin.yourdomain.com app.yourdomain.com portal.yourdomain.com api.yourdomain.com;

    # Let's Encrypt ACME webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Redirect all HTTP traffic to HTTPS permanently
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS Server Block: Production Reverse Proxy with TLS & Hardening
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # Replace with your actual domain names
    server_name admin.yourdomain.com app.yourdomain.com portal.yourdomain.com api.yourdomain.com;

    # --------------------------------------------------------------------------
    # SSL / TLS Configuration (Managed by Let's Encrypt / Certbot)
    # --------------------------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Modern TLS Protocols and Performance
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # --------------------------------------------------------------------------
    # Request Limits & Security Headers
    # --------------------------------------------------------------------------
    # Client upload limit (PDF invoices, attachments, contract uploads)
    client_max_body_size 25M;

    # HTTP Strict Transport Security (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Cross-Site Scripting protection filter
    add_header X-XSS-Protection "1; mode=block" always;

    # Strict referrer policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Restrict device APIs
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Frame options: Dynamic per route (SAMEORIGIN for app, omitted for /embed/*)
    add_header X-Frame-Options $x_frame_options always;

    # CSP frame-ancestors: Allows external domains to embed /embed/*
    add_header Content-Security-Policy $frame_ancestors_policy always;

    # --------------------------------------------------------------------------
    # Compression (Gzip)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # Next.js Static Asset Caching
    # --------------------------------------------------------------------------
    # Immutable hashed static build assets
    location /_next/static/ {
        proxy_pass http://rapidshift_portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Cache in browser and edge caches for 1 year
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Public static assets (favicon, robots.txt, icons)
    location ~* ^/(favicon\.ico|robots\.txt|sitemap\.xml)$ {
        proxy_pass http://rapidshift_portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Server-Sent Events (SSE) & Streaming Routes
    # --------------------------------------------------------------------------
    # Real-time event streams (/api/stream, /api/v1/events/stream, etc.)
    location ~* ^/api/(.*/)?stream$ {
        proxy_pass http://rapidshift_portal;
        proxy_http_version 1.1;

        # CRITICAL: Disable buffering and caching for real-time SSE streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        chunked_transfer_encoding on;

        # Keep connection open for continuous live events
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Forwarded headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # --------------------------------------------------------------------------
    # Client Embeddable Widgets (/embed/*)
    # --------------------------------------------------------------------------
    # Embedded widgets displayed in iframes on client web applications
    location /embed/ {
        proxy_pass http://rapidshift_portal;
        proxy_http_version 1.1;

        # Proxy connection headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Hardened headers customized to ALLOW framing by external domains
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors *" always;
        # Note: X-Frame-Options is intentionally omitted to enable third-party iframe embeds
    }

    # --------------------------------------------------------------------------
    # General Application Reverse Proxy (Admin, Portal, APIs, WebSockets)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://rapidshift_portal;
        proxy_http_version 1.1;

        # WebSockets support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Support streaming React Server Components (RSC) and App Router
        proxy_set_header X-Accel-Buffering no;

        # Standard forward proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Standard HTTP proxy timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
